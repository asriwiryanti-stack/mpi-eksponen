<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chemistry Racing - 50 Tantangan Kimia</title>
    <style>
        :root {
            --primary: #ffaa00;
            --bg-dark: #111;
            --text-light: #fff;
            --correct: #00ff00;
            --wrong: #ff0000;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            position: relative;
            background: #222;
            box-shadow: 0 0 20px rgba(255, 170, 0, 0.5);
        }

        /* Layar Login & Hasil */
        #login-screen, #result-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: var(--primary);
            text-transform: uppercase;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 5px red;
        }

        .input-group {
            margin: 15px 0;
            width: 80%;
            max-width: 300px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 2px solid var(--primary);
            background: #333;
            color: white;
            border-radius: 8px;
            text-align: center;
        }

        .btn-main {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff0000, #ffaa00);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px #ffaa00;
            transition: 0.3s;
            margin-top: 15px;
            width: 80%;
            max-width: 300px;
        }
        
        .btn-secondary {
            background: linear-gradient(45deg, #222, #555);
            box-shadow: 0 0 10px #000;
            border: 2px solid #777;
        }

        .btn-main:hover {
            transform: scale(1.05);
        }

        /* Area Balapan */
        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        /* Desain Jalan Raya */
        #road {
            position: absolute;
            width: 70%;
            height: 200%;
            top: -100%;
            left: 15%;
            background: #333;
            border-left: 8px solid white;
            border-right: 8px solid white;
            animation: moveRoad 2s linear infinite;
        }

        /* Garis Putus-putus di Tengah (Pemisah Lajur) */
        .line {
            position: absolute;
            width: 12px;
            height: 120px;
            background: white;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .line:nth-child(1) { top: 10%; }
        .line:nth-child(2) { top: 30%; }
        .line:nth-child(3) { top: 50%; }
        .line:nth-child(4) { top: 70%; }
        .line:nth-child(5) { top: 90%; }

        @keyframes moveRoad {
            0% { top: -100%; }
            100% { top: 0; }
        }

        /* Desain Mobil di Lajur Berbeda */
        .car {
            position: absolute;
            font-size: 3.5rem;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); /* Efek pergerakan mulus */
            z-index: 10;
        }
        
        /* Mobil Musuh (Kiri) */
        #enemy-car { 
            left: 30%; 
            bottom: 35%; /* Default sedikit di depan */
            transform: translateX(-50%); 
            font-size: 3rem; 
            opacity: 0.9;
        }

        /* Mobil Pemain (Kanan) */
        #player-car { 
            left: 70%; 
            bottom: 25%; /* Default sedikit di belakang */
            transform: translateX(-50%); 
        }

        .nitro-flame {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 35px;
            background: #00ffff;
            border-radius: 50% 50% 0 0;
            box-shadow: 0 0 20px #00ffff;
            animation: flicker 0.1s infinite;
            display: none;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); opacity: 1; }
            50% { transform: translateX(-50%) scale(1.2); opacity: 0.8; }
            100% { transform: translateX(-50%) scale(0.9); opacity: 1; }
        }

        /* Panel Soal & HUD */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 20;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .btn-back-hud {
            background: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 5px red;
        }
        .btn-back-hud:hover { background: darkred; }

        #question-panel {
            position: absolute;
            top: 12%;
            left: 5%;
            width: 90%;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid var(--primary);
            border-radius: 10px;
            padding: 15px;
            z-index: 20;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        #question-text {
            font-size: 1.05rem;
            margin-bottom: 15px;
            text-align: center;
            line-height: 1.4;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .option-btn {
            background: #333;
            border: 2px solid #555;
            padding: 12px 5px;
            font-size: 0.9rem;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-btn:hover {
            background: var(--primary);
            border-color: white;
            color: black;
            font-weight: bold;
        }

        /* Efek Teks ala FF */
        #action-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 4rem;
            font-weight: bold;
            font-style: italic;
            color: yellow;
            text-shadow: 2px 2px 10px red, -2px -2px 10px red;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: 0.2s;
        }

        .show-action {
            animation: popAction 1.2s ease-out;
        }

        @keyframes popAction {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            40% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Layar Login -->
    <div id="login-screen">
        <h1>Chemistry Racing</h1>
        <p>50 Tantangan Konfigurasi Elektron</p>
        <div class="input-group">
            <input type="text" id="playerName" placeholder="Nama Pembalap (Siswa)" required>
        </div>
        <div class="input-group">
            <input type="text" id="playerClass" placeholder="Kelas (Contoh: X IPA 1)" required>
        </div>
        <button class="btn-main" onclick="startGame()">Mulai Balapan 🏁</button>
    </div>

    <!-- Layar Permainan -->
    <div id="game-screen">
        <div id="hud">
            <button class="btn-back-hud" onclick="resetToMenu()">⬅️ Keluar</button>
            <span id="display-name">Player</span>
            <span id="display-level" style="color:var(--primary);">Mudah</span>
            <span id="display-score">Skor: 0</span>
            <span id="display-progress">1/50</span>
        </div>

        <div id="road">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>

        <!-- Musuh di kiri, Pemain di kanan -->
        <div id="enemy-car" class="car">🚙</div>
        <div id="player-car" class="car">
            🏎️
            <div class="nitro-flame" id="nitro"></div>
        </div>

        <div id="action-text">HEADSHOT!</div>

        <div id="question-panel">
            <div id="question-text">Soal muncul di sini</div>
            <div class="options-grid" id="options-container">
                <!-- Tombol opsi -->
            </div>
        </div>
    </div>

    <!-- Layar Hasil -->
    <div id="result-screen" style="display: none;">
        <h1 id="result-title">BOOYAH!</h1>
        <p id="result-desc" style="font-size: 1.2rem; margin: 15px 0; line-height: 1.5;"></p>
        <button class="btn-main" onclick="startGame()">Main Lagi</button>
        <!-- Tombol Kembali ke Menu Awal -->
        <button class="btn-main btn-secondary" onclick="resetToMenu()">Kembali ke Menu Awal</button>
    </div>
</div>

<script>
    // --- DATABASE 50 SOAL KIMIA ---
    const questionsDB = [
        // LEVEL 1: MUDAH (10 SOAL)
        { level: 1, q: "Konfigurasi elektron unsur Natrium (₁₁Na) menurut Bohr adalah...", options: ["2, 8, 1", "2, 8, 2", "2, 7, 2", "1s² 2s² 2p⁶"], answer: 0 },
        { level: 1, q: "Berapakah jumlah elektron valensi unsur Oksigen (₈O)?", options: ["4", "5", "6", "8"], answer: 2 },
        { level: 1, q: "Unsur Karbon (₆C) memiliki konfigurasi elektron 1s² 2s² 2p². Berapakah elektron valensinya?", options: ["2", "4", "6", "8"], answer: 1 },
        { level: 1, q: "Konfigurasi elektron unsur Magnesium (₁₂Mg) adalah...", options: ["2, 8, 8", "2, 8, 2", "2, 2, 8", "2, 8, 3"], answer: 1 },
        { level: 1, q: "Jumlah kulit yang terisi elektron pada atom Klorin (₁₇Cl) adalah...", options: ["1 Kulit", "2 Kulit", "3 Kulit", "4 Kulit"], answer: 2 },
        { level: 1, q: "Helium (₂He) merupakan gas mulia. Berapakah elektron valensinya?", options: ["1", "2", "6", "8"], answer: 1 },
        { level: 1, q: "Kalium (₁₉K) terletak pada golongan IA. Berapakah elektron valensinya?", options: ["1", "2", "8", "9"], answer: 0 },
        { level: 1, q: "Belerang (₁₆S) memiliki konfigurasi elektron...", options: ["2, 8, 4", "2, 8, 5", "2, 8, 6", "2, 8, 8"], answer: 2 },
        { level: 1, q: "Berapa elektron valensi dari Aluminium (₁₃Al)?", options: ["1", "2", "3", "4"], answer: 2 },
        { level: 1, q: "Konfigurasi unsur Neon (₁₀Ne) yang stabil adalah...", options: ["2, 8", "2, 6, 2", "2, 7, 1", "2, 4, 4"], answer: 0 },

        // LEVEL 2: SEDANG (20 SOAL)
        { level: 2, q: "Unsur dengan konfigurasi [Ne] 3s² 3p⁵ terletak pada...", options: ["Gol VA, Per 3", "Gol VIIA, Per 3", "Gol VIIB, Per 3", "Gol VIIA, Per 2"], answer: 1 },
        { level: 2, q: "Unsur Kalsium (₂₀Ca) terletak pada...", options: ["IIA, Periode 4", "IIA, Periode 3", "IVA, Periode 4", "VIIIA, Periode 4"], answer: 0 },
        { level: 2, q: "Unsur X terletak pada Golongan VIA, Periode 3. Konfigurasi akhirnya adalah...", options: ["3s² 3p³", "3s² 3p⁴", "3s² 3p⁵", "4s² 3d⁴"], answer: 1 },
        { level: 2, q: "Fosfor memiliki nomor atom 15. Letaknya dalam tabel periodik adalah...", options: ["Gol VA, Per 3", "Gol IIIA, Per 5", "Gol VA, Per 2", "Gol VB, Per 3"], answer: 0 },
        { level: 2, q: "Atom Y memiliki 7 elektron valensi di kulit ke-4. Nomor atomnya adalah...", options: ["17", "25", "35", "53"], answer: 2 },
        { level: 2, q: "Konfigurasi [Ar] 4s² menunjukkan unsur pada...", options: ["Gol IIA, Per 4", "Gol IVA, Per 4", "Gol IIB, Per 4", "Gol VIIIA, Per 3"], answer: 0 },
        { level: 2, q: "Konfigurasi subkulit atom Nitrogen (₇N) adalah...", options: ["1s² 2s² 2p¹", "1s² 2s² 2p³", "1s² 2s² 2p⁵", "1s² 2s² 2p²"], answer: 1 },
        { level: 2, q: "Unsur S (Z=16) terletak pada...", options: ["Gol VIA, Per 3", "Gol IVA, Per 3", "Gol IIA, Per 4", "Gol VIIA, Per 3"], answer: 0 },
        { level: 2, q: "Skandium (₂₁Sc) memiliki konfigurasi...", options: ["[Ar] 4s² 3d¹", "[Ar] 4s¹ 3d²", "[Ar] 3d³", "[Ne] 3s² 3p⁶ 4s²"], answer: 0 },
        { level: 2, q: "Atom dengan konfigurasi 1s² 2s² 2p⁶ 3s² 3p¹ terletak pada...", options: ["Gol IA, Per 3", "Gol IIIA, Per 3", "Gol VA, Per 3", "Gol IIIA, Per 2"], answer: 1 },
        { level: 2, q: "Arsenik (₃₃As) termasuk dalam golongan...", options: ["IIIA", "IVA", "VA", "VIA"], answer: 2 },
        { level: 2, q: "Argon (₁₈Ar) memiliki elektron valensi berjumlah...", options: ["2", "6", "8", "18"], answer: 2 },
        { level: 2, q: "Unsur golongan IIA periode 3 memiliki nomor atom...", options: ["10", "12", "14", "20"], answer: 1 },
        { level: 2, q: "Jumlah elektron valensi unsur Vanadium (₂₃V) adalah...", options: ["2", "3", "5", "8"], answer: 2 },
        { level: 2, q: "Konfigurasi akhir 4s² 4p⁵ menunjukkan golongan...", options: ["VA", "VIA", "VIIA", "VIIIA"], answer: 2 },
        { level: 2, q: "Seng (₃₀Zn) terletak pada...", options: ["Gol IIB, Per 4", "Gol IIA, Per 4", "Gol VIIIB, Per 4", "Gol IVA, Per 4"], answer: 0 },
        { level: 2, q: "Galium (₃₁Ga) terletak pada...", options: ["Gol IIIA, Per 4", "Gol IIA, Per 4", "Gol IA, Per 5", "Gol IIIB, Per 4"], answer: 0 },
        { level: 2, q: "Bromin (₃₅Br) terletak pada golongan dan periode...", options: ["VA, 4", "VIA, 4", "VIIA, 4", "VIIIA, 4"], answer: 2 },
        { level: 2, q: "Konfigurasi elektron ion K⁺ sama dengan...", options: ["Neon [Ne]", "Argon [Ar]", "Kripton [Kr]", "Xenon [Xe]"], answer: 1 },
        { level: 2, q: "Konfigurasi elektron ion Cl⁻ sama dengan...", options: ["Fluor (F)", "Neon (Ne)", "Argon (Ar)", "Kripton (Kr)"], answer: 2 },

        // LEVEL 3: SULIT (10 SOAL)
        { level: 3, q: "Unsur berkonfigurasi [Ar] 4s² 3d⁵ berada pada...", options: ["Gol VIIA, Per 4", "Gol VIIB, Per 4", "Gol VB, Per 4", "Gol VIIB, Per 3"], answer: 1 },
        { level: 3, q: "Konfigurasi stabil unsur Tembaga (₂₉Cu) adalah...", options: ["[Ar] 4s² 3d⁹", "[Ar] 4s¹ 3d¹⁰", "[Ar] 4s² 3d⁸", "[Kr] 5s¹ 4d¹⁰"], answer: 1 },
        { level: 3, q: "Letak unsur dengan konfigurasi [Ar] 4s² 3d¹⁰ 4p³ adalah...", options: ["Gol VA, Per 4", "Gol IIIA, Per 4", "Gol VB, Per 4", "Gol VIIIA, Per 4"], answer: 0 },
        { level: 3, q: "Aturan setengah penuh pada Kromium (₂₄Cr) menghasilkan konfigurasi...", options: ["[Ar] 4s² 3d⁴", "[Ar] 4s¹ 3d⁵", "[Ar] 4s² 3d³", "[Ar] 3d⁶"], answer: 1 },
        { level: 3, q: "Unsur bervalensi 4s² 3d⁸ terletak pada...", options: ["Gol VIIIB", "Gol IIB", "Gol VIIA", "Gol VIIIA"], answer: 0 },
        { level: 3, q: "Konfigurasi elektron ion Fe²⁺ (Z=26) adalah...", options: ["[Ar] 4s² 3d⁴", "[Ar] 3d⁶", "[Ar] 4s¹ 3d⁵", "[Ar] 3d⁴ 4s²"], answer: 1 },
        { level: 3, q: "Vanadium (₂₃V) terletak pada golongan dan periode...", options: ["VB, Per 4", "IIIB, Per 4", "VA, Per 4", "VIIB, Per 4"], answer: 0 },
        { level: 3, q: "Kobalt (₂₇Co) terletak pada golongan...", options: ["VIIB", "VIIIB", "IB", "IIB"], answer: 1 },
        { level: 3, q: "Konfigurasi elektron ion Cu²⁺ (Z=29) adalah...", options: ["[Ar] 4s¹ 3d⁸", "[Ar] 4s² 3d⁷", "[Ar] 3d⁹", "[Ar] 3d¹⁰"], answer: 2 },
        { level: 3, q: "Unsur dengan konfigurasi akhir 4s² 3d¹⁰ 4p⁶ adalah...", options: ["Gas Mulia (Kr)", "Halogen (Br)", "Logam Alkali", "Logam Transisi"], answer: 0 },

        // LEVEL 4: HOTS (10 SOAL)
        { level: 4, q: "Ion X²⁻ memiliki konfigurasi stabil [Ar]. Letak unsur X saat netral adalah...", options: ["Gol VIA, Per 3", "Gol VIIIA, Per 3", "Gol IIA, Per 4", "Gol VIA, Per 4"], answer: 0 },
        { level: 4, q: "Pada pembentukan ion Fe³⁺, mengapa elektron dari 4s dilepas lebih dulu daripada 3d?", options: ["4s adalah kulit terluar", "Energi 3d lebih rendah", "4s lebih dekat inti", "3d sudah penuh"], answer: 0 },
        { level: 4, q: "Ion Y³⁺ berkonfigurasi 1s² 2s² 2p⁶. Jika Y berikatan dengan Oksigen (VIA), rumusnya adalah...", options: ["YO", "Y₂O", "Y₂O₃", "YO₂"], answer: 2 },
        { level: 4, q: "Atom X memiliki 14 neutron dan nomor massa 27. Letak X dalam SPU adalah...", options: ["Gol IIIA, Per 3", "Gol IVA, Per 3", "Gol VIIIA, Per 2", "Gol IIA, Per 4"], answer: 0 },
        { level: 4, q: "Ion X²⁺ memiliki konfigurasi [Ar] 3d⁶. Unsur X terletak pada...", options: ["Gol VIIIB, Per 4", "Gol VIB, Per 4", "Gol IIB, Per 4", "Gol VIIIA, Per 3"], answer: 0 },
        { level: 4, q: "Suatu ion bermuatan -1 isoelektronik dengan Argon. Unsur tersebut adalah...", options: ["Klorin (Cl)", "Belerang (S)", "Kalium (K)", "Kalsium (Ca)"], answer: 0 },
        { level: 4, q: "Ion X³⁺ berkonfigurasi [Ar]. Pada sistem periodik, unsur netral X terletak pada...", options: ["Gol IIIA, Per 3", "Gol IIIB, Per 4", "Gol VIB, Per 4", "Gol VIIIB, Per 4"], answer: 1 },
        { level: 4, q: "Elektron terakhir unsur Y memiliki bilangan kuantum n=3, l=1, m=0, s=-½. Y terletak pada...", options: ["Gol VIA, Per 3", "Gol VIIA, Per 3", "Gol VA, Per 3", "Gol VIIA, Per 4"], answer: 1 },
        { level: 4, q: "Unsur X bereaksi dengan air membentuk basa kuat XOH. Berapakah elektron valensi X?", options: ["1", "2", "3", "7"], answer: 0 },
        { level: 4, q: "Isotop M memiliki massa 35 dan 37 dengan jumlah proton 17. Konfigurasi elektron unsur M adalah...", options: ["[Ne] 3s² 3p⁵", "[Ar] 4s² 3p⁵", "[Ne] 3s² 3p⁴", "[Ar] 4s² 3d¹⁰"], answer: 0 }
    ];

    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let currentLevel = 1;
    let playerName = "";
    let playerClass = "";

    // --- SISTEM AUDIO ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'shoot') { // Suara Menjawab Benar (Tembakan)
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } else if (type === 'error') { // Suara Nabrak (Salah)
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'booyah') { // Suara Menang
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1);
            osc.start();
            osc.stop(audioCtx.currentTime + 1);
        }
    }

    // --- LOGIKA GAME ---
    function prepareQuestions() {
        const lvl1 = questionsDB.filter(q => q.level === 1).sort(() => Math.random() - 0.5);
        const lvl2 = questionsDB.filter(q => q.level === 2).sort(() => Math.random() - 0.5);
        const lvl3 = questionsDB.filter(q => q.level === 3).sort(() => Math.random() - 0.5);
        const lvl4 = questionsDB.filter(q => q.level === 4).sort(() => Math.random() - 0.5);
        currentQuestions = [...lvl1, ...lvl2, ...lvl3, ...lvl4];
    }

    function startGame() {
        const nameInput = document.getElementById('playerName').value;
        const classInput = document.getElementById('playerClass').value;
        
        if (!nameInput || !classInput) {
            alert("Harap masukkan Nama dan Kelas terlebih dahulu!");
            return;
        }

        playerName = nameInput;
        playerClass = classInput;
        
        // Reset state
        currentQuestionIndex = 0;
        score = 0;
        currentLevel = 1;

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('display-name').innerText = `👤 ${playerName} (${playerClass})`;

        prepareQuestions();
        
        // Reset posisi awal mobil
        document.getElementById('player-car').style.bottom = '25%';
        document.getElementById('enemy-car').style.bottom = '35%';

        loadQuestion();
        
        if(audioCtx.state === 'suspended') audioCtx.resume();
    }

    function resetToMenu() {
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
        // Hapus nama agar pemain berikutnya bisa login
        document.getElementById('playerName').value = "";
        document.getElementById('playerClass').value = "";
    }

    function getLevelName(lvl) {
        if(lvl === 1) return "Tingkat: MUDAH";
        if(lvl === 2) return "Tingkat: SEDANG";
        if(lvl === 3) return "Tingkat: SULIT";
        if(lvl === 4) return "Tingkat: HOTS 🔥";
        return "Tingkat: MAX";
    }

    function loadQuestion() {
        if (currentQuestionIndex >= currentQuestions.length) {
            endGame();
            return;
        }

        const qData = currentQuestions[currentQuestionIndex];
        
        if(qData.level !== currentLevel) {
            currentLevel = qData.level;
            // Kecepatan jalan raya bertambah
            document.getElementById('road').style.animationDuration = (2 - (currentLevel * 0.3)) + 's'; 
        }
        
        document.getElementById('display-level').innerText = getLevelName(currentLevel);
        document.getElementById('display-score').innerText = `Skor: ${score}`;
        document.getElementById('display-progress').innerText = `${currentQuestionIndex + 1}/50`;

        document.getElementById('question-text').innerText = `${currentQuestionIndex + 1}. ${qData.q}`;
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        qData.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(index, qData.answer);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, correctIndex) {
        const playerCar = document.getElementById('player-car');
        const enemyCar = document.getElementById('enemy-car');
        const nitro = document.getElementById('nitro');
        const actionText = document.getElementById('action-text');

        // Matikan tombol saat cek
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => b.disabled = true);

        if (selectedIndex === correctIndex) {
            // BENAR -> Menyalip Musuh
            playSound('shoot');
            score += 100 * currentLevel; 
            
            actionText.innerText = ["HEADSHOT!", "TRIPLE KILL!", "SAVAGE!", "NICE!"][Math.floor(Math.random()*4)];
            actionText.style.color = "#00ff00";
            actionText.classList.remove('show-action');
            void actionText.offsetWidth; 
            actionText.classList.add('show-action');

            nitro.style.display = 'block';
            playerCar.style.bottom = '65%'; // Maju kencang
            enemyCar.style.bottom = '10%'; // Musuh tertinggal di belakang
            
            setTimeout(() => {
                nitro.style.display = 'none';
                playerCar.style.bottom = '25%'; // Kembali ke posisi stabil
                enemyCar.style.bottom = '35%';
            }, 1200);

        } else {
            // SALAH -> Disalip Musuh
            playSound('error');
            score = Math.max(0, score - 50);

            actionText.innerText = "TOO SOON!";
            actionText.style.color = "red";
            actionText.classList.remove('show-action');
            void actionText.offsetWidth;
            actionText.classList.add('show-action');

            playerCar.style.bottom = '5%'; // Mundur (Tertinggal)
            playerCar.style.transform = 'translateX(-50%) rotate(20deg)'; // Oleng
            enemyCar.style.bottom = '70%'; // Musuh melesat
            
            setTimeout(() => {
                playerCar.style.bottom = '25%';
                playerCar.style.transform = 'translateX(-50%) rotate(0deg)'; // Lurus kembali
                enemyCar.style.bottom = '35%';
            }, 1200);
        }

        document.getElementById('display-score').innerText = `Skor: ${score}`;
        currentQuestionIndex++;
        
        setTimeout(() => {
            loadQuestion();
        }, 1500);
    }

    function endGame() {
        playSound('booyah');
        document.getElementById('game-screen').style.display = 'none';
        const resultScreen = document.getElementById('result-screen');
        resultScreen.style.display = 'flex';
        
        // Skor Maksimal = 12000
        let predikat = "";
        if(score >= 10000) predikat = "🌟 SANGAT MEMUASKAN! 🌟<br>Kamu adalah Grandmaster Kimia!";
        else if(score >= 7000) predikat = "🔥 LUAR BIASA! 🔥<br>Kemampuan Kimiamu tingkat dewa!";
        else if(score >= 4000) predikat = "👍 CUKUP BAGUS 👍<br>Sudah memahami dasar dengan baik!";
        else predikat = "😅 JANGAN MENYERAH 😅<br>Ayo perbanyak latihan soal lagi!";

        document.getElementById('result-title').innerText = score > 4000 ? "BOOYAH!" : "SELESAI!";
        document.getElementById('result-desc').innerHTML = 
            `Pembalap: <b>${playerName}</b><br>
             Kelas: <b>${playerClass}</b><br><br>
             Total Skor Akhir: <b style="color:var(--primary); font-size:2rem;">${score}</b><br><br>
             ${predikat}`;
    }
</script>

</body>
</html>
